<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>旅行记账 · 云南12月</title>
<meta name="theme-color" content="#1a5276">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6f8;--card:#fff;--txt:#1f2d3d;--gray:#7b8a99;--blue:#1a5276;--green:#1e8449;--red:#c0392b;--light:#eaf1f6;--line:#e6ebf0}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#18222c;--txt:#e8eef4;--gray:#8fa1b3;--blue:#5aa9e6;--green:#4cc38a;--red:#ff7b72;--light:#1f2c38;--line:#26323d}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5;padding-bottom:90px}
header{background:linear-gradient(135deg,#1a5276,#2e86c1);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0 0 2px}
header .sub{font-size:12px;opacity:.9}
.wrap{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;gap:10px}
.stat{flex:1;text-align:center}
.stat .lab{font-size:12px;color:var(--gray)}
.stat .num{font-size:19px;font-weight:700;margin-top:2px}
.stat .num.green{color:var(--green)}
.stat .num.red{color:var(--red)}
.bar{height:10px;background:var(--light);border-radius:6px;overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#2e86c1,#1e8449);width:0%;transition:width .3s}
.barnote{font-size:12px;color:var(--gray);margin-top:6px;display:flex;justify-content:space-between}
h2{font-size:14px;margin:0 0 10px;color:var(--gray);font-weight:600}
input,select,button{font-family:inherit}
.amt{display:flex;align-items:center;gap:8px}
.amt input{flex:1;font-size:28px;font-weight:700;border:none;background:transparent;color:var(--txt);outline:none;padding:6px 0;width:100%}
.amt .yen{font-size:22px;color:var(--gray)}
.grp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.g{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 0;text-align:center;font-size:13px;color:var(--gray);cursor:pointer}
.g.on{border-color:var(--blue);background:var(--light);color:var(--blue);font-weight:700}
.subs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.s{border:1px solid var(--line);background:transparent;border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--gray);cursor:pointer}
.s.on{border-color:var(--blue);background:var(--light);color:var(--blue);font-weight:600}
.note{width:100%;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:10px;padding:9px 10px;font-size:14px;outline:none}
.save{width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1a5276,#2e86c1);margin-top:10px;cursor:pointer}
.save:active{opacity:.85}
.today{display:flex;justify-content:space-between;align-items:baseline}
.today .big{font-size:24px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--light);color:var(--blue);border-radius:20px;padding:5px 10px;font-size:12px}
.day{margin-top:10px}
.day .dh{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);padding:6px 0;border-bottom:1px dashed var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .t{font-size:11px;color:var(--gray);width:36px;text-align:right;font-variant-numeric:tabular-nums;cursor:pointer;text-decoration:underline dotted}
.item .em{font-size:20px}
.item .mid{flex:1;min-width:0}
.item .nm{font-size:14px}
.item .sub2{font-size:11px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-decoration:underline dotted}
.item .v{font-weight:700;font-size:15px}
.item .del{color:var(--gray);font-size:18px;padding:4px 6px;cursor:pointer}
.bars .bline{margin-bottom:8px}
.bars .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-bottom:3px}
.bars .bt{height:8px;background:var(--light);border-radius:4px;overflow:hidden}
.bars .bt > i{display:block;height:100%;background:#2e86c1;border-radius:4px}
.bars .subline{font-size:11px;color:var(--gray);margin:2px 0 8px;padding-left:2px}
.empty{text-align:center;color:var(--gray);font-size:13px;padding:18px 0}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:10px;z-index:20}
.foot button{flex:1;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:10px;padding:10px;font-size:13px}
.setrow{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--gray);flex-wrap:wrap}
.setrow input{flex:1;width:100%;font-size:15px;padding:8px 10px;border:1px solid var(--line);background:var(--light);color:var(--txt);border-radius:8px}
.setrow input[type=number]{flex:0 0 96px;width:96px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
.dlg.on{display:flex}
.dlg[hidden]{display:none!important}
.dlgbox{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:320px}
.dlgbox .m{font-size:14px;margin-bottom:10px;white-space:pre-wrap}
.dlgbox input{width:100%;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:8px;padding:9px;font-size:15px;margin-bottom:12px;outline:none}
.dlgbtns{display:flex;gap:10px}
.dlgbtns button{flex:1;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:600}
#dlgNo{background:var(--light);color:var(--txt)}
#dlgYes{background:var(--blue);color:#fff}.setrow input[type=number]{width:96px;background:var(--light);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;appearance:none;-webkit-appearance:none}
.setrow input[type=date]{background:var(--light);color:var(--txt);border:1px solid var(--line);border-radius:8px}/* 紧凑设置区 */
body{padding-bottom:64px}
.wrap{padding-bottom:8px}
.setrow{gap:8px;font-size:13px}
.setrow input{flex:1;padding:6px 8px;font-size:14px;height:34px;border-radius:8px}
.setrow input[type=number]{flex:0 0 76px;width:76px;text-align:center}
#setBudget{padding:7px 14px;font-size:13px;height:34px}
#setDates{width:100%;margin-top:8px;padding:8px;font-size:13.5px;font-weight:600;background:var(--light);border:1px solid var(--line);color:var(--txt);border-radius:8px}/* 底部按钮改为随内容,不再固定 */
body{padding-bottom:16px}
.foot{position:static;left:auto;right:auto;bottom:auto;background:transparent;border-top:none;padding:0 12px 16px;max-width:560px;margin:0 auto}.mini{flex:1;padding:7px;font-size:12.5px;border:1px solid var(--line);background:transparent;color:var(--gray);border-radius:8px}
.setrow input{height:32px}
#setDates{padding:7px;font-size:13px}
.foot{display:none}.setrow input[type=number]{flex:0 0 90px;width:90px}
#setDates{height:32px;padding:0;font-size:12.5px;margin-top:8px}.setrow input[type=number]{flex:0 0 96px;width:96px;font-size:14px;padding:6px 8px;appearance:textfield;-webkit-appearance:none;text-align:center}
.setrow input[type=number]::-webkit-outer-spin-button,.setrow input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.setrow input{height:34px;padding:0 10px;font-size:14px;line-height:34px;border-radius:8px}
.setrow input[type=date]{height:34px;line-height:34px;font-size:14px}
#setDates{height:34px;line-height:34px;padding:0;font-size:13px}
#subTitle{font-size:12px;opacity:.9}body{padding-bottom:0;background:var(--bg)}
.wrap{padding-bottom:0}
.wrap > .card:last-child{margin-bottom:0}#setDates{display:block;width:100%;margin:8px 0 0;box-sizing:border-box}</style>
</head>
<body>
<header>
  <h1>🧾 旅行记账</h1>
  <div class="sub" id="subTitle">云南 12/1-12/9 · 数据只存在这台手机</div>
</header>
<div class="wrap">

  <div class="card">
    <div class="row">
      <div class="stat"><div class="lab">总预算</div><div class="num" id="sBudget">¥0</div></div>
      <div class="stat"><div class="lab">已花</div><div class="num" id="sSpent">¥0</div></div>
      <div class="stat"><div class="lab">还剩</div><div class="num green" id="sLeft">¥0</div></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="barnote"><span id="barPct">0%</span><span>已花 / 总预算</span></div>
  </div>

  <div class="card">
    <h2>今天花了多少</h2>
    <div class="today"><div class="big" id="todayNum">¥0</div><div style="font-size:12px;color:var(--gray)" id="todayCount">0 笔</div></div>
    <div class="chips" id="todayChips"></div>
  </div>

  <div class="card">
    <h2>记一笔 · 写清买了啥</h2>
    <div class="amt"><span class="yen">¥</span><input id="amt" type="number" inputmode="decimal" placeholder="0" step="0.01"></div>
    <div class="grp" id="grp"></div>
    <div class="subs" id="subs"></div>
    <input class="note" id="note" type="text" placeholder="写名称,如:珍珠奶茶、烧烤、门票(会自动分类)" maxlength="24">
    <button class="save" id="save">保存</button>
  </div>

  <div class="card">
    <h2>分类花销</h2>
    <div class="bars" id="bars"></div>
  </div>

  <div class="card">
    <h2>明细</h2>
    <div id="list"></div>
  </div>

  <div class="card">
    <h2>设置</h2>
    <div class="setrow">
      总预算 <input id="budgetIn" type="number" inputmode="decimal" step="100">
      <button id="setBudget" style="border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px">保存</button>
    </div>
    <div class="setrow" style="margin-top:10px">出发 <input id="startIn" type="date"></div>
    <div class="setrow" style="margin-top:6px">返程 <input id="endIn" type="date"></div>
    <button id="setDates" style="display:block;width:100%;box-sizing:border-box;margin:10px 0 0;border:1px solid var(--line);background:var(--light);color:var(--txt);border-radius:8px;padding:8px 0;font-size:13px;font-weight:600">保存日期</button>
    <div style="font-size:12px;color:var(--gray);margin-top:4px" id="dateRange"></div>
    <div style="font-size:12px;color:var(--gray);margin-top:6px">改完点保存,顶部预算/剩余/进度条会自动更新</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="exportBtn" class="mini">导出数据</button>
      <button id="clearBtn" class="mini">清空</button>
    </div>
  </div>

</div>

<div class="dlg" id="dlg" hidden><div class="dlgbox"><div class="m" id="dlgMsg"></div><input id="dlgIn" type="text" style="display:none"><div class="dlgbtns"><button id="dlgNo">取消</button><button id="dlgYes">确定</button></div></div></div><script>
const GROUPS={
  '餐饮':['正餐','早餐','小吃','零食','饮品','水果'],
  '交通':['打车','公交地铁','租车油费','停车','火车机票'],
  '住宿':['住宿'],
  '门票':['门票','娱乐'],
  '购物':['购物','特产'],
  '其他':['医药','其他']
};
const GORDER=['餐饮','交通','住宿','门票','购物','其他'];
const EMO={'餐饮':'🍚','交通':'🚕','住宿':'🏨','门票':'🎫','购物':'🛍️','其他':'📦'};
const RULES=[
 [/奶茶|咖啡|茶|果汁|可乐|饮料|矿泉水|酸奶/,['餐饮','饮品']],
 [/早餐|米线|饵丝|包子|豆浆|粥/,['餐饮','早餐']],
 [/烧烤|串|小吃|凉粉|粑粑|乳扇|豆腐|炸|烤肠/,['餐饮','小吃']],
 [/零食|薯片|巧克力|面包|饼干/,['餐饮','零食']],
 [/水果|苹果|香蕉|橙|西瓜/,['餐饮','水果']],
 [/火锅|午餐|晚餐|正餐|饭|餐厅|酸辣鱼|牦牛|腊排骨|黑山羊|鸡|烤肉|菜/,['餐饮','正餐']],
 [/打车|出租|滴滴|网约车/,['交通','打车']],
 [/地铁|公交|大巴|巴士/,['交通','公交地铁']],
 [/加油|油费|租车|过路|高速/,['交通','租车油费']],
 [/停车|车位/,['交通','停车']],
 [/火车|高铁|动车|机票|飞机|航班/,['交通','火车机票']],
 [/住|酒店|民宿|房费|客栈/,['住宿','住宿']],
 [/门票|景区|索道|进山|观光车/,['门票','门票']],
 [/演出|千古情|骑马|娱乐|体验|扎染/,['门票','娱乐']],
 [/特产|伴手礼|鲜花饼|牛肉干|茶饼/,['购物','特产']],
 [/购物|纪念品|超市|买/,['购物','购物']],
 [/药|医院|氧气|高反/,['其他','医药']]
];
function autoCat(s){for(const [re,c] of RULES){if(re.test(s))return c;}return null;}const KEY='ynLedger_v1';
const START=new Date('2026-12-03T00:00:00');
const END=new Date('2026-12-11T23:59:59');
const DEF={budget:10000,start:'2026-12-01',end:'2026-12-09',items:[]};

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items))return d;}catch(e){}return JSON.parse(JSON.stringify(DEF));}
let st=load();
const LEGACY={'饭':['餐饮','正餐'],'零食':['餐饮','零食'],'奶茶':['餐饮','饮品'],'打车':['交通','打车'],'门票':['门票','门票'],'住宿':['住宿','住宿'],'购物':['购物','购物'],'特产':['购物','特产'],'油车':['交通','租车油费'],'其他':['其他','其他']};
function fixItems(){st.items.forEach(x=>{
  if(!x.group||!x.cat||!GROUPS[x.group]||!GROUPS[x.group].includes(x.cat)){const m=LEGACY[x.cat]||['其他','其他'];x.group=m[0];x.cat=m[1];}
  const a=autoCat(x.note||'');
  if(a&&x.group==='餐饮'&&x.cat==='正餐'&&a[0]==='餐饮'&&a[1]!=='正餐')x.cat=a[1];
});}
fixItems();
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const fmt=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2});
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const sum=a=>a.reduce((s,x)=>s+Number(x.amt||0),0);let dlgCb=null;
function openDlg(msg,def,cb){
  dlgCb=cb;
  document.getElementById('dlgMsg').textContent=msg;
  const inp=document.getElementById('dlgIn');
  if(def===null){inp.style.display='none';}else{inp.style.display='block';inp.value=def;}
  document.getElementById('dlg').hidden=false;document.getElementById('dlg').classList.add('on');
  if(def!==null)setTimeout(()=>inp.focus(),60);
}
function ask(msg,cb){openDlg(msg,null,cb);}
function askText(msg,def,cb){openDlg(msg,def,cb);}
document.getElementById('dlgNo').onclick=()=>{var d=document.getElementById('dlg');d.classList.remove('on');d.hidden=true;dlgCb=null;};
document.getElementById('dlgYes').onclick=()=>{
  const inp=document.getElementById('dlgIn');
  const val=inp.style.display==='none'?true:inp.value;
  {var d=document.getElementById('dlg');d.classList.remove('on');d.hidden=true;}
  const cb=dlgCb;dlgCb=null;if(cb)cb(val);
};
let curG='餐饮', curS='正餐';

function renderCats(){
  document.getElementById('grp').innerHTML=GORDER.map(g=>`<div class="g ${g===curG?'on':''}" data-g="${g}">${EMO[g]} ${g}</div>`).join('');
  document.querySelectorAll('#grp .g').forEach(el=>el.onclick=()=>{curG=el.dataset.g;curS=GROUPS[curG][0];renderCats();});
  document.getElementById('subs').innerHTML=GROUPS[curG].map(s=>`<span class="s ${s===curS?'on':''}" data-s="${s}">${s}</span>`).join('');
  document.querySelectorAll('#subs .s').forEach(el=>el.onclick=()=>{curS=el.dataset.s;renderCats();});
}

function render(){
  fixItems();
  const spent=sum(st.items), left=st.budget-spent;
  document.getElementById('sBudget').textContent=fmt(st.budget);
  document.getElementById('sSpent').textContent=fmt(spent);
  const le=document.getElementById('sLeft');le.textContent=fmt(left);le.className='num '+(left<0?'red':'green');
  const pct=st.budget>0?Math.min(100,spent/st.budget*100):0;
  document.getElementById('bar').style.width=pct.toFixed(1)+'%';
  document.getElementById('barPct').textContent=pct.toFixed(0)+'%';

  const today=todayStr();
  const todayItems=st.items.filter(x=>x.date===today);
  document.getElementById('todayNum').textContent=fmt(sum(todayItems));
  document.getElementById('todayCount').textContent=todayItems.length+' 笔';
  const byG={};todayItems.forEach(x=>{byG[x.group]=(byG[x.group]||0)+Number(x.amt)});
  document.getElementById('todayChips').innerHTML=Object.keys(byG).length?Object.entries(byG).map(([g,v])=>`<span class="chip">${EMO[g]||'📦'} ${g} ${fmt(v)}</span>`).join(''):'<span style="font-size:12px;color:var(--gray)">今天还没记账</span>';

  const all={};st.items.forEach(x=>{all[x.group]=all[x.group]||{};all[x.group][x.cat]=(all[x.group][x.cat]||0)+Number(x.amt)});
  const gs=Object.keys(all).map(g=>[g,sum(Object.values(all[g]).map(v=>({amt:v}))) ]).sort((a,b)=>b[1]-a[1]);
  const max=gs.length?gs[0][1]:1;
  document.getElementById('bars').innerHTML=gs.length?gs.map(([g,v])=>{
    const subs=Object.entries(all[g]).sort((a,b)=>b[1]-a[1]).map(([c,n])=>c+' '+fmt(n)).join(' · ');
    return `<div class="bline"><div class="bl"><span>${EMO[g]||'📦'} ${g}</span><span>${fmt(v)}</span></div><div class="bt"><i style="width:${(v/max*100).toFixed(0)}%"></i></div><div class="subline">${subs}</div></div>`;
  }).join(''):'<div class="empty">还没有记录</div>';

  const groups={};st.items.forEach(x=>{(groups[x.date]=groups[x.date]||[]).push(x)});
  const dates=Object.keys(groups).sort().reverse();
  document.getElementById('list').innerHTML=dates.length?dates.map(d=>{
    const its=groups[d].slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    return `<div class="day"><div class="dh"><span>${d}${d===today?' · 今天':''}</span><span>${fmt(sum(its))}</span></div>`+
      its.map(x=>`<div class="item"><span class="t" data-id="${x.id}">${x.time||'--:--'}</span><span class="em">${EMO[x.group]||'📦'}</span><div class="mid"><div class="nm">${x.note||x.cat}</div><div class="sub2" data-id="${x.id}">${x.group} · ${x.cat}</div></div><span class="v">${fmt(x.amt)}</span><span class="del" data-id="${x.id}">✕</span></div>`).join('')+`</div>`;
  }).join(''):'<div class="empty">点上面「记一笔」开始</div>';

  document.querySelectorAll('.t').forEach(el=>el.onclick=()=>{
    const it=st.items.find(x=>x.id===el.dataset.id);if(!it)return;
    askText('修改时间(HH:MM)',it.time||'12:00',v=>{
      if(!/^([01]?\d|2[0-3]):[0-5]\d$/.test(v.trim())){ask('格式不对,要 09:15 这种',()=>{});return;}
      it.time=v.trim().padStart(5,'0');save();render();
    });
  });
  document.querySelectorAll('.sub2').forEach(el=>el.onclick=()=>{
    const it=st.items.find(x=>x.id===el.dataset.id);if(!it)return;
    const list=Object.keys(GROUPS).map(g=>g+'('+GROUPS[g].join('/')+')').join('\n');
    askText('改分类:大分类-小类,如 餐饮-饮品\n'+list,it.group+'-'+it.cat,v=>{
      const m=v.trim().split(/[-－·\s]+/);const g=m[0],s=m[1]||'';
      if(!GROUPS[g]||!GROUPS[g].includes(s)){ask('没这个分类,照格式写,如 餐饮-饮品',()=>{});return;}
      it.group=g;it.cat=s;save();render();
    });
  });
  document.querySelectorAll('.del').forEach(el=>el.onclick=()=>{
    ask('删除这笔?',()=>{st.items=st.items.filter(x=>x.id!==el.dataset.id);save();render();});
  });

  document.getElementById('budgetIn').value=st.budget;
  if(!st.start)st.start='2026-12-01';
  if(!st.end)st.end='2026-12-09';
  document.getElementById('startIn').value=st.start;
  document.getElementById('endIn').value=st.end;
  document.getElementById('dateRange').textContent='当前行程:'+st.start+' 至 '+st.end;(function(){function f(x){var a=x.split('-');return parseInt(a[1])+'/'+parseInt(a[2]);}document.getElementById('subTitle').textContent='云南 '+f(st.start)+'-'+f(st.end)+' · 数据只存在这台手机';})();
}

document.getElementById('save').onclick=()=>{
  const amt=parseFloat(document.getElementById('amt').value);
  if(!amt||amt<=0){ask('请输入金额',()=>{});return;}
  st.items.push({id:Date.now()+''+Math.random().toString(16).slice(2),date:todayStr(),time:new Date().toTimeString().slice(0,5),group:curG,cat:curS,note:document.getElementById('note').value.trim(),amt});
  save();
  document.getElementById('amt').value='';document.getElementById('note').value='';
  document.getElementById('amt').focus();
  render();
};
document.getElementById('amt').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('save').click();});
document.getElementById('note').addEventListener('input',e=>{
  const c=autoCat(e.target.value);
  if(c){curG=c[0];curS=c[1];renderCats();}
});
document.getElementById('setDates').onclick=()=>{
  const s=document.getElementById('startIn').value, e=document.getElementById('endIn').value;
  if(!s||!e||s>e){ask('日期不对:出发要早于返程',()=>{});return;}
  st.start=s;st.end=e;save();render();
};
document.getElementById('setBudget').onclick=()=>{
  const v=parseFloat(document.getElementById('budgetIn').value);
  if(!v||v<=0){ask('请输入预算',()=>{});return;}
  st.budget=v;save();render();
};
document.getElementById('exportBtn').onclick=()=>{
  const txt=JSON.stringify(st,null,2);
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(txt);
  a.download='travel-ledger-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();
};
document.getElementById('clearBtn').onclick=()=>{ask('清空所有记账记录?(预算保留)',()=>{st.items=[];save();render();});};

renderCats();render();
document.getElementById('budgetIn').value=st.budget;
</script>

</body>
</html>
