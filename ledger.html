<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>旅行记账 · 云南12月</title>
<meta name="theme-color" content="#1a5276">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6f8;--card:#fff;--txt:#1f2d3d;--gray:#7b8a99;--blue:#1a5276;--green:#1e8449;--red:#c0392b;--light:#eaf1f6;--line:#e6ebf0}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#18222c;--txt:#e8eef4;--gray:#8fa1b3;--blue:#5aa9e6;--green:#4cc38a;--red:#ff7b72;--light:#1f2c38;--line:#26323d}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5;padding-bottom:90px}
header{background:linear-gradient(135deg,#1a5276,#2e86c1);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0 0 2px}
header .sub{font-size:12px;opacity:.9}
.wrap{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;gap:10px}
.stat{flex:1;text-align:center}
.stat .lab{font-size:12px;color:var(--gray)}
.stat .num{font-size:19px;font-weight:700;margin-top:2px}
.stat .num.green{color:var(--green)}
.stat .num.red{color:var(--red)}
.bar{height:10px;background:var(--light);border-radius:6px;overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#2e86c1,#1e8449);width:0%;transition:width .3s}
.barnote{font-size:12px;color:var(--gray);margin-top:6px;display:flex;justify-content:space-between}
h2{font-size:14px;margin:0 0 10px;color:var(--gray);font-weight:600}
input,select,button{font-family:inherit}
.amt{display:flex;align-items:center;gap:8px}
.amt input{flex:1;font-size:28px;font-weight:700;border:none;background:transparent;color:var(--txt);outline:none;padding:6px 0;width:100%}
.amt .yen{font-size:22px;color:var(--gray)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.cat{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 0;text-align:center;font-size:11px;color:var(--gray);cursor:pointer}
.cat.on{border-color:var(--blue);background:var(--light);color:var(--blue);font-weight:600}
.cat .em{display:block;font-size:18px;margin-bottom:2px}
.note{width:100%;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:10px;padding:9px 10px;font-size:14px;outline:none}
.save{width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1a5276,#2e86c1);margin-top:10px;cursor:pointer}
.save:active{opacity:.85}
.today{display:flex;justify-content:space-between;align-items:baseline}
.today .big{font-size:24px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--light);color:var(--blue);border-radius:20px;padding:5px 10px;font-size:12px}
.day{margin-top:10px}
.day .dh{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);padding:6px 0;border-bottom:1px dashed var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .em{font-size:20px}
.item .t{font-size:11px;color:var(--gray);width:36px;text-align:right;font-variant-numeric:tabular-nums}
.item .mid{flex:1;min-width:0}
.item .nm{font-size:14px}
.item .sub2{font-size:11px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:700;font-size:15px}
.item .del{color:var(--gray);font-size:18px;padding:4px 6px;cursor:pointer}
.bars .bline{margin-bottom:8px}
.bars .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-bottom:3px}
.bars .bt{height:8px;background:var(--light);border-radius:4px;overflow:hidden}
.bars .bt > i{display:block;height:100%;background:#2e86c1;border-radius:4px}
.empty{text-align:center;color:var(--gray);font-size:13px;padding:18px 0}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:10px;z-index:20}
.foot button{flex:1;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:10px;padding:10px;font-size:13px}
.setrow{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--gray);flex-wrap:wrap}
.setrow input{width:110px;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:8px;padding:7px 8px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🧾 旅行记账</h1>
  <div class="sub">云南 12/3-12/11 · 数据只存在这台手机</div>
</header>
<div class="wrap">

  <div class="card">
    <div class="row">
      <div class="stat"><div class="lab">总预算</div><div class="num" id="sBudget">¥0</div></div>
      <div class="stat"><div class="lab">已花</div><div class="num" id="sSpent">¥0</div></div>
      <div class="stat"><div class="lab">还剩</div><div class="num green" id="sLeft">¥0</div></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="barnote"><span id="barPct">0%</span><span>已花 / 总预算</span></div>
  </div>

  <div class="card">
    <h2>今天花了多少</h2>
    <div class="today"><div class="big" id="todayNum">¥0</div><div style="font-size:12px;color:var(--gray)" id="todayCount">0 笔</div></div>
    <div class="chips" id="todayChips"></div>
  </div>

  <div class="card">
    <h2>记一笔 · 自动记下时间</h2>
    <div class="amt"><span class="yen">¥</span><input id="amt" type="number" inputmode="decimal" placeholder="0" step="0.01"></div>
    <div class="cats" id="cats"></div>
    <input class="note" id="note" type="text" placeholder="备注(可选),比如:古城米线" maxlength="20">
    <button class="save" id="save">保存</button>
  </div>

  <div class="card">
    <h2>分类花销</h2>
    <div class="bars" id="bars"></div>
  </div>

  <div class="card">
    <h2>明细</h2>
    <div id="list"></div>
  </div>

  <div class="card">
    <h2>设置</h2>
    <div class="setrow">
      总预算 <input id="budgetIn" type="number" inputmode="decimal" step="100">
      <button id="setBudget" style="border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px">保存</button>
    </div>
    <div class="setrow" style="margin-top:8px">行程 <span id="dateRange"></span></div>
    <div style="font-size:12px;color:var(--gray);margin-top:6px">改完点保存,顶部预算/剩余/进度条会自动更新</div>
  </div>

</div>

<div class="foot">
  <button id="exportBtn">导出数据</button>
  <button id="clearBtn">清空</button>
</div>

<script>
const CATS=[
  ['饭','🍚'],['零食','🍿'],['奶茶','🧋'],['打车','🚕'],['门票','🎫'],
  ['住宿','🏨'],['购物','🛒'],['特产','🎁'],['油车','🚗'],['其他','📦']
];
const KEY='ynLedger_v1';
const START=new Date('2026-12-03T00:00:00');
const END=new Date('2026-12-11T23:59:59');
const DEF={budget:12700,items:[]};

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items))return d;}catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
let st=load();
function save(){localStorage.setItem(KEY,JSON.stringify(st));}
const fmt=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2});
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const sum=a=>a.reduce((s,x)=>s+Number(x.amt||0),0);

let curCat='饭';

function renderCats(){
  document.getElementById('cats').innerHTML=CATS.map(([n,e])=>`<div class="cat ${n===curCat?'on':''}" data-c="${n}"><span class="t">${x.time||'--:--'}</span><span class="em">${e}</span>${n}</div>`).join('');
  document.querySelectorAll('#cats .cat').forEach(el=>el.onclick=()=>{curCat=el.dataset.c;renderCats();});
}

function render(){
  const spent=sum(st.items);
  const left=st.budget-spent;
  document.getElementById('sBudget').textContent=fmt(st.budget);
  document.getElementById('sSpent').textContent=fmt(spent);
  const le=document.getElementById('sLeft');
  le.textContent=fmt(left);
  le.className='num '+(left<0?'red':'green');
  const pct=st.budget>0?Math.min(100,spent/st.budget*100):0;
  document.getElementById('bar').style.width=pct.toFixed(1)+'%';
  document.getElementById('barPct').textContent=pct.toFixed(0)+'%';
  const today=todayStr();
  const todayItems=st.items.filter(x=>x.date===today);
  const todaySum=sum(todayItems);
  document.getElementById('todayNum').textContent=fmt(todaySum);
  document.getElementById('todayCount').textContent=todayItems.length+' 笔';
  const byCat={};
  todayItems.forEach(x=>{byCat[x.cat]=(byCat[x.cat]||0)+Number(x.amt)});
  document.getElementById('todayChips').innerHTML=Object.keys(byCat).length?Object.entries(byCat).map(([c,v])=>{
    const e=(CATS.find(x=>x[0]===c)||['',''])[1];
    return `<span class="chip">${e} ${c} ${fmt(v)}</span>`;}).join(''):'<span style="font-size:12px;color:var(--gray)">今天还没记账</span>';





  // 分类
  const all={};
  st.items.forEach(x=>{all[x.cat]=(all[x.cat]||0)+Number(x.amt)});
  const arr=Object.entries(all).sort((a,b)=>b[1]-a[1]);
  const max=arr.length?arr[0][1]:1;
  document.getElementById('bars').innerHTML=arr.length?arr.map(([c,v])=>{
    const e=(CATS.find(x=>x[0]===c)||['','📦'])[1];
    return `<div class="bline"><div class="bl"><span>${e} ${c}</span><span>${fmt(v)}</span></div><div class="bt"><i style="width:${(v/max*100).toFixed(0)}%"></i></div></div>`;}).join(''):'<div class="empty">还没有记录</div>';

  // 明细(按日期倒序)
  const groups={};
  st.items.forEach(x=>{(groups[x.date]=groups[x.date]||[]).push(x)});
  const dates=Object.keys(groups).sort().reverse();
  document.getElementById('list').innerHTML=dates.length?dates.map(d=>{
    const its=groups[d].slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    const s=sum(its);
    return `<div class="day"><div class="dh"><span>${d}${d===today?' · 今天':''}</span><span>${fmt(s)}</span></div>`+
      its.map(x=>{const e=(CATS.find(y=>y[0]===x.cat)||['','📦'])[1];
        return `<div class="item"><span class="t">${x.time||'--:--'}</span><span class="em">${e}</span><div class="mid"><div class="nm">${x.cat}</div><div class="sub2">${x.note||''}</div></div><span class="v">${fmt(x.amt)}</span><span class="del" data-id="${x.id}">✕</span></div>`;}).join('')+`</div>`;}).join(''):'<div class="empty">点上面「记一笔」开始</div>';

  document.querySelectorAll('.del').forEach(el=>el.onclick=()=>{
    if(confirm('删除这笔?')){st.items=st.items.filter(x=>x.id!==el.dataset.id);save();render();}
  });

  document.getElementById('budgetIn').value=st.budget;
  const f=d=>d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
  document.getElementById('dateRange').textContent=f(START)+' - '+f(END);
}

document.getElementById('save').onclick=()=>{
  const amt=parseFloat(document.getElementById('amt').value);
  if(!amt||amt<=0){alert('请输入金额');return;}
  st.items.push({id:Date.now()+''+Math.random().toString(16).slice(2),date:todayStr(),time:new Date().toTimeString().slice(0,5),cat:curCat,note:document.getElementById('note').value.trim(),amt});
  save();
  document.getElementById('amt').value='';document.getElementById('note').value='';
  document.getElementById('amt').focus();
  render();
};
document.getElementById('amt').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('save').click();});

document.getElementById('setBudget').onclick=()=>{
  const v=parseFloat(document.getElementById('budgetIn').value);
  if(!v||v<=0){alert('请输入预算');return;}
  st.budget=v;save();render();
};

document.getElementById('exportBtn').onclick=()=>{
  const txt=JSON.stringify(st,null,2);
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert('已复制到剪贴板,可粘到微信保存'),()=>prompt('复制下面内容:',txt));}
  else prompt('复制下面内容:',txt);
};
document.getElementById('clearBtn').onclick=()=>{
  if(confirm('清空所有记账记录?(预算保留)')){
    st.items=[];save();render();
  }
};

renderCats();render();
document.getElementById('budgetIn').value=st.budget;
</script>
</body>
</html>
